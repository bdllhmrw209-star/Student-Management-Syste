 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
</head>
<body>

<script>

// 1. Student Class
class Student {
    constructor(id, name, grades, attendance) {
        this.id = id;
        this.name = name;
        this.grades = grades;
        this.attendance = attendance;
    }

    // Calculate Average
    calculateAverage() {
        let total = this.grades.reduce((sum, grade) => sum + grade, 0);
        return total / this.grades.length;
    }

    // Calculate Grade
    getGrade() {
        let average = this.calculateAverage();

        if (average >= 90) return "A";
        else if (average >= 80) return "B";
        else if (average >= 70) return "C";
        else if (average >= 60) return "D";
        else if (average >= 50) return "E";
        else return "F";
    }

    // Final Result
    getResult() {
        let average = this.calculateAverage();

        if (average >= 50 && this.attendance >= 75) {
            return "ناجح";
        } else {
            return "يحتاج مراجعة";
        }
    }
}

// 2. Students List
const studentsList = [
    new Student(101, "Ahmed", [90, 85, 95], 90),
    new Student(102, "Mohamed", [45, 48, 42], 80),
    new Student(103, "Ali", [70, 75, 80], 85),
    new Student(104, "Omar", [40, 45, 48], 70)
];

// 3. Filter Struggling Students
const strugglingStudents = studentsList.filter(student => {
    let average = student.calculateAverage();
    return average >= 40 && average <= 49;
});

// 4. Add 5 Mercy Marks using Map
const mercyStudents = strugglingStudents.map(student => {
    return {
        id: student.id,
        name: student.name,
        oldAverage: student.calculateAverage(),
        newAverage: student.calculateAverage() + 5
    };
});

// 5. Calculate Total using Reduce
const totalNewAverages = mercyStudents.reduce((sum, student) => {
    return sum + student.newAverage;
}, 0);

// 6. Calculate Mercy Average
const mercyAverage = mercyStudents.length > 0
    ? totalNewAverages / mercyStudents.length
    : 0;

// 7. Print Students Report
console.log("===== STUDENTS REPORT =====");

studentsList.forEach(student => {
    console.log("----------------------");
    console.log("Name:", student.name);
    console.log("Average:", student.calculateAverage());
    console.log("Grade:", student.getGrade());
    console.log("Result:", student.getResult());
});

// 8. Print Mercy Students
console.log("===== MERCY COMMITTEE =====");
console.log(mercyStudents);

// 9. Print Mercy Average
console.log("===== MERCY AVERAGE =====");
console.log(mercyAverage);

</script>

</body>
</html>
